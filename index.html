<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estadística Senior CBA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Senior CBA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/cba-touch-180.png">
<link rel="icon" href="icons/cba-192.png">
<style>
:root{
  --ink:#111214; --red:#D8237C; --red-d:#b01763; --paper:#f4f4f2; --card:#fff;
  --line:#dcdcd8; --mute:#6b6d70; --ok:#1e7a3c; --ok-bg:#e3f3e8; --warn:#a86a00; --warn-bg:#fdf1d6;
  --bad:#b3122b; --bad-bg:#fbe3e7;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* cabecera */
header{position:sticky;top:0;z-index:20;background:#fff;padding:calc(8px + var(--sat)) 14px 8px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--ink);box-shadow:0 3px 0 var(--red)}
header img{height:44px;width:auto;flex:none}
.h-t{flex:1;min-width:0}
.h-t b{display:block;font-size:19px;font-weight:900;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-t span{display:block;font-size:11px;font-weight:800;color:var(--red);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;border:0;background:var(--ink);color:#fff;border-radius:8px;height:36px;padding:0 12px;font-weight:800;font-size:13px}

main{flex:1;padding:14px 12px calc(84px + var(--sab))}

/* pestañas del partido */
.seg{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:10px 12px}
.seg button.on{background:var(--red)}

/* barra inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);padding-bottom:var(--sab)}
nav div{max-width:820px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:#a9abae;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:15px 4px 14px;border-top:3px solid transparent}
nav button.on{color:#fff;border-top-color:var(--red)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;padding-left:9px;border-left:5px solid var(--red);line-height:1.2}
.sub{color:var(--mute);font-size:13px}

/* formulario */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .w2{grid-column:1/-1}
label.f{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
label.f input,label.f select,textarea,.inp{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;font-size:16px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);min-height:42px}
textarea{resize:vertical;font-weight:500;line-height:1.4}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.lv{display:flex;gap:6px;margin-top:4px}
.lv button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;min-height:42px;font-weight:800;font-size:13px;letter-spacing:.04em}
.lv button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.btn{border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:800;padding:12px 16px;font-size:14px;letter-spacing:.03em}
.btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}

.dot{flex:none;width:11px;height:11px;border-radius:50%;background:#b9bbbd}
.dot.ok{background:var(--ok)} .dot.pend{background:#d99a00} .dot.bad{background:var(--bad)}
.login{max-width:420px;margin:28px auto 0}
.login label.f{margin-bottom:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 11px;font-weight:700;font-size:14px;margin-bottom:12px}
/* lista de partidos */
.m{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.m .d{flex:none;width:52px;text-align:center;background:var(--ink);color:#fff;border-radius:8px;padding:6px 0;line-height:1.1}
.m .d b{display:block;font-size:19px;font-weight:900}
.m .d i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.m .t{flex:1;min-width:0}
.m .t b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .t span{display:block;font-size:12.5px;color:var(--mute)}
.pill{flex:none;font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 9px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}

/* convocatoria */
.pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.num{flex:none;width:34px;text-align:center;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.pl .n{flex:1;min-width:0;font-weight:700}
.pl .n input{margin-top:5px;font-size:14px;min-height:36px;padding:6px 9px;font-weight:500}
.chk{flex:none;width:46px;height:38px;border-radius:8px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:17px;color:#fff}
.chk.on{background:var(--ink)}
.pl.off .n>span,.pl.off .num{color:var(--mute)}
.count{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.count b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}

/* sextos */
.estado{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-weight:700;border:1px solid}
.estado.ok{background:var(--ok-bg);color:var(--ok);border-color:#b9dfc5}
.estado.warn{background:var(--warn-bg);color:var(--warn);border-color:#f0d79a}
.estado.bad{background:var(--bad-bg);color:var(--bad);border-color:#f1b9c2}
.estado b{display:block;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.estado ul{margin:6px 0 0;padding-left:18px;font-weight:600;font-size:13.5px}
.sx-wrap{overflow-x:auto}
table.sx{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
.sx col.cw{width:29%}
.card.flush{margin-left:-12px;margin-right:-12px;border-radius:0;border-left:0;border-right:0;padding:8px 6px 12px}
.card.flush .hint{padding:0 6px}
.sx th{background:var(--ink);color:#fff;font-size:11px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:7px 2px;text-align:center}
.sx th.r{background:var(--red)}
.sx th.g{background:#3a3c40}
.sx th:first-child{border-radius:8px 0 0 0;text-align:left;padding-left:8px}
.sx th:last-child{border-radius:0 8px 0 0}
.sx td{border-bottom:1px solid var(--line);padding:3px 2px;text-align:center;background:#fff}
.sx tr:nth-child(even) td{background:#f1f1ef}
.sx td.who{text-align:left;padding:4px 4px 4px 2px}
.sx td.who div{display:flex;align-items:center;gap:6px}
.sx td.who b{flex:none;width:26px;text-align:center;font-weight:900;font-size:15px}
.sx td.who span{font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sx tr.out td.who span{text-decoration:line-through;color:var(--mute)}
.cell{width:100%;height:38px;border-radius:7px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:15px;color:#fff;padding:0}
.cell.on{background:var(--ink);border-color:var(--ink)}
.cell.six.on{background:#3a3c40;border-color:#3a3c40}
.tot{display:block;border-radius:7px;padding:8px 0;font-weight:900;font-size:15px}
.tot.ok{background:var(--ok-bg);color:var(--ok)}
.tot.warn{background:var(--warn-bg);color:var(--warn)}
.tot.bad{background:var(--bad-bg);color:var(--bad)}
.fal{width:100%;height:38px;border-radius:7px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:15px;padding:0}
.fal.f4{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.fal.f5{background:var(--bad);border-color:var(--bad);color:#fff}
.sx tfoot td{background:#fff!important;border-bottom:0;padding-top:7px;font-weight:900;font-size:13px}
.sx tfoot td.who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-left:8px}
.cnt{display:block;border-radius:999px;padding:3px 0}
.cnt.ok{background:var(--ok-bg);color:var(--ok)} .cnt.warn{background:var(--warn-bg);color:var(--warn)} .cnt.bad{background:var(--bad-bg);color:var(--bad)}
.hint{font-size:12.5px;color:var(--mute);margin-top:10px}

.cell.must{border:2px dashed var(--red);color:var(--red);background:#fff6f7}
.cell.no{background:repeating-linear-gradient(135deg,#e6e6e3 0 4px,#f3f3f1 4px 8px);border-color:#d2d3d1}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);margin-top:10px;padding:0 6px}
.leg i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:5px;border:1.5px solid #b9bbbd;font-style:normal}
.leg i.must{border:2px dashed var(--red)} .leg i.no{background:repeating-linear-gradient(135deg,#e6e6e3 0 4px,#f3f3f1 4px 8px)} .leg i.on{background:var(--ink);border-color:var(--ink)}
/* directo */
.sxsel{display:flex;gap:6px;margin-bottom:12px}
.sxsel button{flex:1;border:1.5px solid var(--ink);background:#fff;border-radius:8px;height:44px;font-weight:900;font-size:16px}
.sxsel button.on{background:var(--ink);color:#fff}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.score .tm{font-size:11px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .n{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.score .sep{font-size:30px;font-weight:900;color:var(--mute)}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.pts button{border:1.5px solid var(--ink);background:#fff;border-radius:8px;height:44px;font-weight:900;font-size:15px;padding:0}
.pts button.m{border-color:var(--line);color:var(--mute)}
.parc{font-size:12.5px;color:var(--mute);text-align:center;margin-top:10px;font-variant-numeric:tabular-nums}
.lp{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.lp:first-of-type{border-top:0}
.lp .n{flex:1;min-width:0;font-weight:700;line-height:1.2}
.lp .n small{display:block;font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.lp .n small.must{color:var(--red)} .lp .n small.no{color:var(--mute)}
.lp.out .n{text-decoration:line-through;color:var(--mute)}
.fb{flex:none;display:flex;align-items:center;gap:4px}
.fb button{width:40px;height:40px;border-radius:8px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:17px;padding:0}
.fb b{min-width:34px;height:40px;line-height:40px;text-align:center;border-radius:8px;background:#f1f1ef;font-size:17px;font-variant-numeric:tabular-nums}
.fb b.f4{background:var(--warn-bg);color:var(--warn)} .fb b.f5{background:var(--bad);color:#fff}
.sw{flex:none;border:0;border-radius:8px;height:40px;padding:0 12px;font-weight:800;font-size:13px;background:var(--ink);color:#fff}
.sw.in{background:var(--red)}
.h2r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.h2r h2{margin:0}
/* temporada */
.tp tr.pr{cursor:pointer}
.tp .nm{display:block;font-weight:700;line-height:1.2}
.tp .bar{display:block;height:5px;border-radius:3px;background:#e4e4e1;margin-top:5px;overflow:hidden}
.tp .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.tp td.lo{color:var(--warn);font-weight:900} .tp td.up{color:var(--ok);font-weight:900}
.tp td small{display:block;font-size:10.5px;font-weight:800;color:var(--bad);letter-spacing:.02em}
.kp.k4{grid-template-columns:repeat(2,1fr)}
.dist{display:flex;gap:6px;align-items:flex-end;height:96px;margin-top:4px}
.dist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.dist i{display:block;width:100%;background:var(--ink);border-radius:5px 5px 0 0;min-height:2px}
.dist i.l{background:#3a3c40}
.dist b{font-size:13px;font-weight:900;margin-bottom:3px}
.dist span{font-size:11px;font-weight:800;color:var(--mute);margin-top:4px}
.hm{padding:9px 0;border-top:1px solid var(--line)}
.hm:first-of-type{border-top:0}
.hm .t{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.hm .t span{font-weight:700;color:var(--mute);font-size:12.5px;flex:none}
.hm .d{font-size:13.5px;margin-top:2px}
.hm.no .t b,.hm.no .d{color:var(--mute)}
.si{display:block;font-size:11.5px;font-weight:700;color:var(--mute);margin-top:1px}
.si b{color:var(--bad);font-weight:900}
table.tp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tp th{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 4px;text-align:center;border-bottom:2px solid var(--ink)}
.tp th:first-child,.tp td:first-child{text-align:left}
.tp td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-weight:700}
.tp td:first-child{font-weight:700}
.tp td b{display:inline-block;width:28px;font-weight:900}
.tp td.hi{color:var(--bad);font-weight:900}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kp b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.kp span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.estado.off{background:#ececea;color:#44464a;border-color:#d6d6d3}
/* objetivos */
.ev{display:flex;gap:6px}
.ev button{width:38px;height:38px;border-radius:50%;border:2.5px solid;background:#fff;font-size:10px;font-weight:900;padding:0}
.ev .s{border-color:var(--ok);color:var(--ok)} .ev .p{border-color:#d99a00;color:#a86a00} .ev .n{border-color:var(--bad);color:var(--bad)}
.ev .s.on{background:var(--ok);color:#fff} .ev .p.on{background:#d99a00;color:#fff} .ev .n.on{background:var(--bad);color:#fff}
.ob{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.ob .hd{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;font-weight:900;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.ob .hd .ev button{width:32px;height:32px;background:transparent}
.ob .hd .ev .s.on{background:var(--ok)} .ob .hd .ev .p.on{background:#d99a00} .ob .hd .ev .n.on{background:var(--bad)}
.ob textarea{border:0;border-radius:0;margin:0}
.ind{padding:9px 0;border-top:1px solid var(--line)}
.ind:first-of-type{border-top:0}
.ind .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ind .top span{flex:1;min-width:0;font-weight:700}

/* normativa */
.rule{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0}
.rule b{flex:none;width:74px;font-size:11px;font-weight:900;letter-spacing:.05em;color:var(--red);padding-top:2px}
.rule p{margin:0;font-size:14px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.stp:first-of-type{border-top:0}
.stp span{font-weight:600;font-size:14px}
.stp div{display:flex;align-items:center;gap:8px;flex:none}
.stp button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:18px}
.stp b{min-width:24px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(74px + var(--sab));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;z-index:40;max-width:90%;text-align:center}
@media (min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.cell,.fal{height:42px}.sx col.cw{width:34%}.sx td.who span{font-size:15px}.card.flush{margin-left:0;margin-right:0;border-radius:12px;border:1px solid var(--line);padding:10px 12px}}
@media (prefers-reduced-motion:no-preference){.cell,.chk,.ev button{transition:background .12s}}

.logo{flex:none;width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;letter-spacing:.04em}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn:disabled,.tmr button:disabled{opacity:.4}
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:10px 10px 9px;margin-bottom:8px}
.sb .tm{text-align:center;min-width:0}
.sb .tm span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#c9cacc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .tm b{display:block;font-size:44px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.sb .tm i{display:inline-block;font-style:normal;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#2c2e32;color:#e6e6e6}
.sb .tm i.al{background:var(--red);color:#fff}
.qs{display:grid;grid-template-columns:repeat(2,34px);gap:4px}
.qs button{height:30px;border-radius:7px;border:1.5px solid #55575b;background:transparent;color:#fff;font-weight:900;font-size:12px;padding:0}
.qs button.on{background:#fff;color:var(--ink);border-color:#fff}
.qs button:last-child{grid-column:1/-1}
.court{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chips{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;min-width:0}
.chip{flex:none;display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 5px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip b{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:900}
.chip.al{border-color:var(--bad);color:var(--bad)} .chip.al b{background:var(--bad)}
.chip em{font-style:normal}
@media (max-width:599px){.chip{padding:4px}.chip em{display:none}.chip b{min-width:30px;height:30px;line-height:30px;font-size:14px}}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pad{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px;min-width:0}
.pad.n{border-top:4px solid var(--ink)} .pad.r{border-top:4px solid var(--red)}
.ph{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.pb{height:50px;border-radius:9px;border:1.5px solid #b9bbbd;background:#fff;font-weight:900;font-size:14px;padding:0 2px;color:var(--ink);touch-action:manipulation}
.pb.mk{background:var(--ink);border-color:var(--ink);color:#fff}
.pb.ms{background:#f1f1ef}
.pb:active{transform:scale(.96)}
.tmr{display:flex;align-items:center;gap:5px;margin-top:6px}
.tmr button{height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:12px;padding:0 8px}
.tmr button:first-child{flex:1}
.tmr span{font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.av{border-radius:9px;padding:8px 10px;font-weight:700;font-size:13.5px;margin-bottom:6px;border-left:5px solid}
.av.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.av.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
.cmp td{width:27%;text-align:center;font-weight:800;font-size:15px;padding:6px 2px;border-top:1px solid var(--line)}
.cmp th{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);padding:6px 2px;border-top:1px solid var(--line)}
.cmp tr:first-child td,.cmp tr:first-child th{border-top:0}
.cmp td.w{color:var(--ok);font-weight:900} .cmp td.l{color:var(--bad)}
.cmp.big td{font-size:15.5px;padding:8px 2px}
.cmp thead td{font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--ink)}
.evr{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600}
.evr:first-of-type{border-top:0}
.evr span.r{color:var(--red-d)}
.evr button{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:900}
.evr b.pos{color:var(--ok)} .evr b.neg{color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;border-radius:16px 16px 0 0;padding:14px 12px calc(16px + var(--sab));max-width:820px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk button{height:68px;border-radius:12px;border:2px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;touch-action:manipulation;min-width:0}
.pk button b{font-size:24px;font-weight:900;line-height:1}
.pk button span{font-size:11.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk button.on{background:var(--ink);color:#fff}
.pk button.eq{border-style:dashed;border-color:var(--mute);color:var(--mute)}
.pk.bn{grid-template-columns:repeat(4,1fr);margin-top:8px}
.pk.bn button{height:52px;border:1.5px solid #b9bbbd}
.pk.bn button b{font-size:17px}
.bx{overflow-x:auto;margin:0 -12px;padding:0 12px}
table.box{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%;white-space:nowrap}
.box th{font-size:10.5px;font-weight:900;letter-spacing:.04em;color:var(--mute);padding:6px 7px;text-align:center;border-bottom:2px solid var(--ink)}
.box td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.box .st{text-align:left;position:sticky;left:0;background:#fff;font-weight:700;padding-left:0}
.box td.st b{display:inline-block;min-width:22px;font-weight:900}
.box tfoot td{font-weight:900;border-top:2px solid var(--ink);border-bottom:0}
@media (min-width:600px){.pb{height:60px;font-size:16px}.pk{grid-template-columns:repeat(6,1fr)}.pk.bn{grid-template-columns:repeat(7,1fr)}.sb .tm b{font-size:56px}}
</style>
</head>

      }else if(!Object.keys(m.ev||{}).length&&(m.fecha!==x.fecha||(x.hora&&m.hora!==x.hora))){
        m.fecha=x.fecha;m.hora=x.hora||m.hora;if(!m.llegadaManual)m.llegada=menos(m.hora,60);ch++;

    });

  }).catch(function(){});

function hoy(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function menos(h,min){
  var p=/^(\d{1,2}):(\d{2})$/.exec(h||"");if(!p)return"";
  var t=(+p[1])*60+(+p[2])-min;if(t<0)t+=1440;
  return("0"+Math.floor(t/60)).slice(-2)+":"+("0"+(t%60)).slice(-2);
}
function convocados(m){return sortedRoster().filter(function(p){return m.conv[p.id];});}
function enPista(m){return convocados(m).filter(function(p){return(m.pista||{})[p.id];});}
function fechaLarga(m){

  var s=(+p[3])+" "+MESES[+p[2]-1]+" "+p[1];

}

/* ================= Estadística ================= */
function linea(){return{p2m:0,p2a:0,p3m:0,p3a:0,ftm:0,fta:0,ro:0,rd:0,as:0,st:0,to:0,pf:0,pts:0,pm:0};}
function suma(L,a){
  switch(a){
    case"2m":L.p2m++;L.p2a++;L.pts+=2;break;case"2x":L.p2a++;break;
    case"3m":L.p3m++;L.p3a++;L.pts+=3;break;case"3x":L.p3a++;break;
    case"1m":L.ftm++;L.fta++;L.pts+=1;break;case"1x":L.fta++;break;
    default:if(L[a]!==undefined)L[a]++;
  }
}
function puntosDe(a){return a==="2m"?2:a==="3m"?3:a==="1m"?1:0;}
function eventos(m){
  var out=[];Object.keys(m.ev||{}).forEach(function(k){var e=m.ev[k];if(e)out.push(Object.assign({id:k},e));});
  out.sort(function(a,b){return a.n-b.n;});return out;
}
/* Agregado de un partido; q = cuarto concreto o null para todo */
function agg(m,q){
  var o={n:linea(),r:linea(),pl:{},dor:{},evs:eventos(m)};
  o.evs.forEach(function(e){
    if(q!=null&&e.q!==q)return;
    var T=e.t==="n"?o.n:o.r;suma(T,e.a);
    if(e.t==="n"&&e.p){if(!o.pl[e.p])o.pl[e.p]=linea();suma(o.pl[e.p],e.a);}
    if(e.t==="r"&&e.d!=null&&e.d!==""){if(!o.dor[e.d])o.dor[e.d]=linea();suma(o.dor[e.d],e.a);}
    var pt=puntosDe(e.a);
    if(pt&&e.l)e.l.forEach(function(pid){if(!o.pl[pid])o.pl[pid]=linea();o.pl[pid].pm+=e.t==="n"?pt:-pt;});
  });
  return o;
}
function der(L,opp){
  var fga=L.p2a+L.p3a,fgm=L.p2m+L.p3m,pos=fga+0.44*L.fta-L.ro+L.to;
  return{fga:fga,fgm:fgm,reb:L.ro+L.rd,
    efg:fga?(fgm+0.5*L.p3m)/fga:null,
    p2:L.p2a?L.p2m/L.p2a:null,p3:L.p3a?L.p3m/L.p3a:null,ft:L.fta?L.ftm/L.fta:null,
    pos:pos,ppp:pos>0?L.pts/pos:null,
    tov:(fga+0.44*L.fta+L.to)>0?L.to/(fga+0.44*L.fta+L.to):null,
    orb:opp&&(L.ro+opp.rd)>0?L.ro/(L.ro+opp.rd):null,
    ftr:fga?L.fta/fga:null};
}
function val(L){return L.pts+L.ro+L.rd+L.as+L.st-(L.p2a-L.p2m)-(L.p3a-L.p3m)-(L.fta-L.ftm)-L.to-L.pf;}
function pct(x){return x==null?"–":Math.round(x*100)+"%";}
function dec(x,n){return x==null?"–":x.toFixed(n==null?1:n).replace(".",",");}
function faltasEq(m,t,q){var c=0;eventos(m).forEach(function(e){if(e.t===t&&e.a==="pf"&&e.q===q)c++;});return c;}
/* Avisos en directo: lo que conviene saber ahora mismo */
function avisos(m){
  var o=agg(m,null),N=der(o.n,o.r),R=der(o.r,o.n),out=[],q=m.q||0;
  var evs=o.evs,run={t:null,p:0},i;
  for(i=evs.length-1;i>=0;i--){var pt=puntosDe(evs[i].a);if(!pt)continue;if(run.t===null)run.t=evs[i].t;if(evs[i].t!==run.t)break;run.p+=pt;}
  if(run.p>=7)out.push({k:run.t==="n"?"ok":"bad",t:"Parcial de "+(run.t==="n"?run.p+"-0 a favor":"0-"+run.p+" en contra")+"."});
  var chR=o.r.ro+o.n.rd;
  if(chR>=6&&R.orb>=0.35)out.push({k:"bad",t:"Rebote defensivo: el rival coge "+pct(R.orb)+" de sus fallos ("+o.r.ro+" rebotes ofensivos)."});
  var chN=o.n.ro+o.r.rd;
  if(chN>=6&&N.orb>=0.35)out.push({k:"ok",t:"Rebote ofensivo: cogéis "+pct(N.orb)+" de vuestros fallos ("+o.n.ro+")."});
  if(N.pos>=10&&N.tov>=0.22)out.push({k:"bad",t:"Pérdidas: "+o.n.to+" en "+Math.round(N.pos)+" posesiones ("+pct(N.tov)+")."});
  if(R.pos>=10&&R.tov>=0.22)out.push({k:"ok",t:"El rival pierde "+pct(R.tov)+" de sus posesiones ("+o.r.to+" pérdidas)."});
  if(o.n.fta>=8&&N.ft<0.6)out.push({k:"bad",t:"Tiros libres: "+o.n.ftm+" de "+o.n.fta+" ("+pct(N.ft)+")."});
  if(o.r.p3a>=8&&R.p3>=0.4)out.push({k:"bad",t:"Triples del rival: "+o.r.p3m+" de "+o.r.p3a+" ("+pct(R.p3)+")."});
  if(o.n.p3a>=8&&N.p3!=null&&N.p3<0.25)out.push({k:"bad",t:"Triples: "+o.n.p3m+" de "+o.n.p3a+" ("+pct(N.p3)+")."});
  if(N.pos>=12&&R.pos>=12&&N.ppp!=null&&R.ppp!=null)out.push({k:N.ppp>=R.ppp?"ok":"bad",t:"Puntos por posesión: "+dec(N.ppp,2)+" vosotros, "+dec(R.ppp,2)+" el rival."});
  var fn=faltasEq(m,"n",q),fr=faltasEq(m,"r",q);
  if(q<4){
    if(fn>=4)out.push({k:"bad",t:"Lleváis "+fn+" faltas de equipo en el "+QN[q]+": cada falta más son tiros libres."});
    if(fr>=4)out.push({k:"ok",t:"El rival lleva "+fr+" faltas de equipo en el "+QN[q]+": atacad el aro."});
  }
  convocados(m).forEach(function(p){var L=o.pl[p.id];if(L&&L.pf>=4)out.push({k:"bad",t:"#"+p.num+" "+corto(p)+" lleva "+L.pf+" faltas"+(L.pf>=5?" (eliminado).":".")});});
  return out;
}
function addEv(m,t,a,p,d){
  if(!m.ev)m.ev={};
  var e={q:m.q||0,t:t,a:a,n:Date.now()*100+(idSeq++%100)};
  if(p)e.p=p;if(d!=null&&d!=="")e.d=String(d);
  if(puntosDe(a))e.l=enPista(m).map(function(x){return x.id;});
  m.ev[uid("e")]=e;
}

    case"pista":
      if(!m.pista)m.pista={};
      if(m.pista[v])delete m.pista[v];
      else{if(enPista(m).length>=5){toast("Ya hay 5 en pista: saca a uno primero");return;}m.pista[v]=true;}
      break;
    case"tm":if(!m.tm)m.tm={};var tt=b.dataset.t,hf=(m.q||0)<2?"h1":"h2",mxt=hf==="h1"?2:3;if(!m.tm[tt])m.tm[tt]={};m.tm[tt][hf]=Math.max(0,Math.min(mxt,(m.tm[tt][hf]||0)+(+b.dataset.d)));break;
    case"undo":var ev=eventos(m);if(ev.length){delete m.ev[ev[ev.length-1].id];toast("Acción deshecha");}break;
    case"delev":delete m.ev[v];break;
    case"rq":ui.rq=v;rerenderKeepScroll();return;
    case"ts":ui.ts=v;rerenderKeepScroll();return;
    case"copiar":copiar(waText(m));return;
    case"addp":S.seq=(S.seq||0)+1;S.roster.push({id:uid("p"),num:"",name:"Jugador nuevo",ap:""});break;
    case"askdelp":ui.confirm="p"+v;break;
    case"delp":S.roster=S.roster.filter(function(p){return p.id!==v;});break;
    case"exportar":exportar();return;
    case"recal":importCal();toast("Calendario comprobado");return;
    case"asksalir":ui.confirm="out";rerenderKeepScroll();return;
    case"salir":if(A.logout)A.logout();return;
    default:return;
  }
  save();
  if(keep)rerenderKeepScroll();else{render();window.scrollTo(0,0);}
});
document.addEventListener("submit",function(e){
  if(e.target.id==="rf"){
    e.preventDefault();var d=String($("rd").value||"").replace(/\D/g,"");var m=match();if(!m||!ui.pick)return;
    if(d===""){toast("Escribe un dorsal");return;}
    if(!m.rnum)m.rnum={};m.rnum[d]=true;apunta(m,"r",ui.pick.a,null,d);return;
  }
  if(e.target.id!=="lf")return;e.preventDefault();
  if(!A.login){ui.loginErr="La sincronización no se ha cargado. Recarga la página con conexión.";render();return;}
  var em=$("le").value,pw=$("lp").value;ui.loginBusy=true;ui.loginErr="";render();$("le").value=em;A.login(em,pw);
});
document.addEventListener("input",function(e){
  var t=e.target,m=match(),d=t.dataset;
  if(d.pn){var p=jug(d.pn);if(p)p.num=String(t.value).replace(/\D/g,"").slice(0,2);save();return;}
  if(d.pa){var pa=jug(d.pa);if(pa)pa.ap=t.value.trim();save();return;}
  if(d.pp){var q=jug(d.pp);if(q)q.name=t.value;save();return;}
  if(d.team){S[d.team]=t.value;save();return;}
  if(!m)return;
  if(d.k){
    m[d.k]=t.value;
    if(d.k==="llegada")m.llegadaManual=!!t.value;
    if(d.k==="hora"&&!m.llegadaManual){m.llegada=menos(t.value,60);var l=document.querySelector('[data-k="llegada"]');if(l)l.value=m.llegada;}
  }else if(d.mot)m.motivos[d.mot]=t.value;
  else return;
  save();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.k==="rival"||t.dataset.k==="fecha"||t.dataset.k==="hora"||t.dataset.k==="jornada"){var m=match(),b=document.querySelector(".h-t");if(m&&b)b.innerHTML='<b>'+esc(m.rival?"vs "+m.rival:"Partido nuevo")+'</b><span>'+esc(fechaLarga(m)||equipo())+'</span>';}
  if(t.id==="imp"&&t.files&&t.files[0]){
    var r=new FileReader();
    r.onload=function(){
      try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.roster)||!Array.isArray(d.matches))throw 0;S=d;save();ui.mid=null;render();toast("Copia importada: "+S.matches.length+" partidos");}
      catch(x){toast("El archivo no es una copia válida");}
    };
    r.readAsText(t.files[0]);
  }
});
function copiar(txt){
  var ok=function(){toast("Mensaje copiado");},ko=function(){var t=$("wa");if(t){t.focus();t.select();}toast("Selecciona el texto y cópialo");};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,ko);else ko();}catch(e){ko();}
}
function exportar(){
  try{
    var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="estadistica-senior-cba-"+hoy()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1500);
    toast("Copia exportada");
  }catch(e){toast("No se ha podido exportar en este navegador");}
}
function typing(){var a=document.activeElement;return!!a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.type!=="file"));}
document.addEventListener("focusout",function(){if(pendingRender)setTimeout(function(){if(pendingRender&&!typing())rerenderKeepScroll();},60);});

A.loginResult=function(err){ui.loginBusy=false;ui.loginErr=err||"";if(err)render();};

  S.roster=team.roster||[];S.seq=team.seq||S.roster.length;S.nombre=team.nombre||"";S.calOff=team.calOff||{};S.matches=matches||[];

render();

})();
